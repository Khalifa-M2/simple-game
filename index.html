<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Star Catcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 style="color: black;">⭐ Star Catcher ⭐</h1>
  <div id="gameArea">
    <!-- Your rocket spaceship -->
    <img id="player" src="rocket.png" alt="Spaceship">

    <!-- Multiple falling stars -->
    <img class="star" src="star.png" alt="Star">
    <img class="star" src="star.png" alt="Star">
    <img class="star" src="star.png" alt="Star">
  </div>

  <p id="score" style="color: black;">Score: 0</p>
  <p id="highScore" style="color: black;">High Score: 0</p>
  <p id="lives" style="color: black;">Lives: 3</p>
  <p id="timer" style="color: black;">Time: 30</p>

  <label for="difficulty" style="color: black;">Choose Difficulty:</label>
  <select id="difficulty">
    <option value="easy">Easy</option>
    <option value="medium" selected>Medium</option>
    <option value="hard">Hard</option>
  </select>

  <button id="restartBtn">Restart Game</button>

  <script src="app.js"></script>
</body>
</html>
